[project]
name = "afterimage"
version = "0.11.4"
keywords = ["afterimage", "synthetic", "dataset-generation", "synthetic-dataset"]
authors = [
    { name = "Yusuf Sarıgöz", email = "yusuf@altai.dev"}
]
description = "Create synthetic datasets based on your documents"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio==1.67.1",
    "letsearch-client>=0.1.1",
    "pydantic>=2.10.4",
    "tqdm>=4.67.1",
    "filelock",
    "qdrant-client",
    "sentence-transformers",
    "langdetect>=1.0.9",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "pyarrow>=14.0.1",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "google-genai==1.38.0",
    "openai>=1.107.3",
    "python-docx>=1.2.0",
    "striprtf>=0.0.29",
    "gradio>=6.3.0",
]

[project.urls]
homepage = "https://github.com/altaidevorg/afterimage"
project = "https://github.com/altaidevorg/afterimage"
repository = "https://github.com/altaidevorg/afterimage"

[tool.setuptools.packages.find]
where = ["."]
include = ["afterimage", "afterimage.*"]

[dependency-groups]
dev = [
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.1.0",
]
