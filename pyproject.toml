[project]
name = "afterimage"
version = "0.13.0"
keywords = ["afterimage", "synthetic", "dataset-generation", "synthetic-dataset"]
authors = [
    { name = "Yusuf Sarıgöz", email = "yusuf@altai.dev"}
]
description = "Create synthetic datasets based on your documents"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio==1.67.1",
    "letsearch-client>=0.1.1",
    "pydantic>=2.10.4",
    "tqdm>=4.67.1",
    "filelock",
    "qdrant-client",
    "sentence-transformers",
    "langdetect>=1.0.9",
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",
    "pyarrow>=14.0.1",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",
    "google-genai==1.38.0",
    "openai>=1.107.3",
    "python-docx>=1.2.0",
    "striprtf>=0.0.29",
    "gradio>=6.3.0",
    "fastmcp>=3.2.0",
]

[project.urls]
homepage = "https://github.com/altaidevorg/afterimage"
project = "https://github.com/altaidevorg/afterimage"
repository = "https://github.com/altaidevorg/afterimage"

[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
afterimage-server = "afterimage.server:main"

# Demo UI model training (`examples/demo_ui/training_scripts/train.py`); mirrors `examples/demo_ui/training_scripts/requirements.txt`
training = [
    "torch>=2.0.0",
    "transformers>=4.56.2,<5.0.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "huggingface_hub>=0.22.0",
    "trl>=0.29.1,<0.30.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["afterimage", "afterimage.*"]

[dependency-groups]
dev = [
    "myst-parser>=4.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that call real APIs (deselect with '-m \"not integration\"')",
]
