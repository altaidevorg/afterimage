[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afterimage"
version = "0.14.4"
keywords = ["afterimage", "dataset-generation", "synthetic-dataset", "tool-calling", "structured-output", "preference-data", "persona-driven"]
authors = [
    { name = "Yusuf Sarıgöz", email = "yusuf@altai.dev"}
]
description = "Generate conversational, tool-calling, structured-output, and preference datasets — easily and at scale"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.0.0",
    "filelock",
    "google-genai==1.38.0",
    "grpcio==1.67.1",
    "huggingface-hub>=0.22.0",
    "langdetect>=1.0.9",
    "matplotlib>=3.7.0",
    "openai>=1.107.3",
    "openpyxl>=3.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.1",
    "pydantic>=2.10.4",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
    "qdrant-client",
    "seaborn>=0.12.0",
    "striprtf>=0.0.29",
    "tqdm>=4.67.1",
]

[project.urls]
homepage = "https://altai.dev"
project = "https://github.com/altaidevorg/afterimage"
repository = "https://github.com/altaidevorg/afterimage"

[project.optional-dependencies]
# ProcessEmbeddingProvider; QdrantRetriever; QualityChecker (local embedding model)
embeddings-local = [
    "sentence-transformers>=3.0.0",
]

server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.0",
    "sse-starlette>=2.0",
    "aiosqlite>=0.20.0",
]

# examples/demo_ui (Gradio, FastMCP) and training_scripts/train.py (mirrors training_scripts/requirements.txt)
training = [
    "torch>=2.0.0",
    "transformers>=4.56.2,<5.0.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "trl>=0.29.1,<0.30.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=3.2.0",
    "gradio>=6.3.0",
]

[project.scripts]
afterimage = "afterimage.cli:main"
afterimage-server = "afterimage.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["afterimage", "afterimage.*"]

[dependency-groups]
# Includes sentence-transformers so tests and local Qdrant/quality workflows work without a separate extra.
dev = [
    "myst-parser>=4.0.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.10",
    "sentence-transformers>=3.0.0",
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that call real APIs (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["examples"]
# Lint uses Ruff defaults (E4, E7, E9, F). Add [tool.ruff.lint] with extend-select later
# (e.g. "I", "UP", "B") when you want isort / pyupgrade / bugbear across the tree.
